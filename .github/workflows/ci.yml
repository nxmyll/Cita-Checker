name: run-cita-checker
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Set to "true" to force run outside time window'
        required: false
        default: 'false'
  schedule:
    - cron: '*/30 * * * *'  # adjust if you want scheduled runs

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install minimal system dependencies (Chromium binary + libs)
        run: |
          sudo apt-get update

          # Try to install a chromium binary (package name differs across images)
          if ! sudo apt-get install -y --no-install-recommends chromium-browser; then
            echo "chromium-browser not available, trying chromium package name"
            sudo apt-get install -y --no-install-recommends chromium || true
          fi

          # Install minimal libs required by headless Chrome
          sudo apt-get install -y --no-install-recommends \
            libnss3 \
            libatk1.0-0 \
            libxss1 \
            fonts-liberation || true

      - name: Show browser version
        run: |
          which chromium-browser || which chromium || which google-chrome-stable || echo "no chrome found"
          chromium-browser --version || chromium --version || google-chrome --version || true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run cita_checker (Selenium Manager will handle chromedriver)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOC_NUMBER: ${{ secrets.DOC_NUMBER }}
          FULL_NAME: ${{ secrets.FULL_NAME }}
          NATIONALITY: ${{ secrets.NATIONALITY }}
          ERROR_SCREENSHOT_PATH: error.png
          ERROR_PAGE_SOURCE: page_source.html
          # Map FORCE_RUN from the workflow input so you can force runs on demand
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: |
          set -o pipefail

          # Detect available Chrome/Chromium binary and export CHROME_BIN for the script
          export CHROME_BIN=$(which chromium-browser || which chromium || which google-chrome-stable || echo "/usr/bin/chromium-browser")
          echo "Using CHROME_BIN=$CHROME_BIN"

          # Create a temporary user-data-dir for Chrome and export it so the Python script can reuse it
          export CHROME_USER_DATA_DIR=$(mktemp -d -t chrome-user-data-XXXX)
          echo "Using CHROME_USER_DATA_DIR=$CHROME_USER_DATA_DIR"

          # Run the checker (Selenium Manager will download a matching chromedriver)
          python -u cita_checker.py || true

          # Cleanup the user-data-dir we created (script also tries to remove it, but do it here too)
          rm -rf "$CHROME_USER_DATA_DIR" || true

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cita-checker-debug
          path: |
            error.png
            page_source.html
            chromedriver.log
          if-no-files-found: ignore
