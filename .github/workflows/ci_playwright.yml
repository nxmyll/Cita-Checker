name: run-cita-checker-playwright
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Set to "true" to force run outside time window'
        required: false
        default: 'false'
  schedule:
    - cron: '*/30 * * * *'  # optional: adjust or remove

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install minimal system dependencies (for browsers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 \
            libatk1.0-0 \
            libxss1 \
            fonts-liberation \
            ca-certificates \
            wget || true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python requirements + Playwright
        run: |
          set -e
          python -m pip install --upgrade pip
          # install listed requirements (should include requests etc.)
          pip install -r requirements.txt || true
          # ensure Playwright is installed (install via pip if not present)
          python -m pip install playwright --upgrade
          # install Playwright browsers and required system dependencies
          python -m playwright install --with-deps

      - name: Show environment & browser info
        run: |
          echo "Using Python $(python -V)"
          python -c "from playwright.sync_api import sync_playwright; print('Playwright OK');"

      - name: Run cita_checker (Playwright)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOC_NUMBER: ${{ secrets.DOC_NUMBER }}
          FULL_NAME: ${{ secrets.FULL_NAME }}
          NATIONALITY: ${{ secrets.NATIONALITY }}
          ERROR_SCREENSHOT_PATH: error.png
          ERROR_PAGE_SOURCE: page_source.html
          LAST_PAGE_PNG: last_page.png
          LAST_PAGE_HTML: last_page.html
          # Map FORCE_RUN from workflow input
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: |
          set -o pipefail
          set -e
          echo "FORCE_RUN=$FORCE_RUN"
          export PLAYWRIGHT_USER_DATA_DIR=$(mktemp -d -t pw-user-data-XXXX)
          echo "PLAYWRIGHT_USER_DATA_DIR=$PLAYWRIGHT_USER_DATA_DIR"
          # Run the checker (will exit non-zero on real failures)
          python -u cita_checker.py
          RC=$?
          echo "cita_checker.py exit code: $RC"
          # cleanup (script attempts cleanup too)
          rm -rf "$PLAYWRIGHT_USER_DATA_DIR" || true
          exit $RC

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cita-checker-debug
          path: |
            last_page.png
            last_page.html
            error.png
            page_source.html
          if-no-files-found: ignore
